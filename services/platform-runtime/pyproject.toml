[tool.poetry]
name = "metastruct-runtime"
version = "1.0.0"
description = "FastAPI backend runtime engine for Metastruct specs"
authors = ["Metastruct Team"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = "^0.27.0"
sqlalchemy = "^2.0.25"
asyncpg = "^0.29.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
